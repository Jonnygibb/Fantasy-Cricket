
services:
  db:
    image: postgres:18.1-alpine
    container_name: fantasy-cricket-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - fantasy-cricket-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: production
    container_name: fantasy-cricket-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  web-dev:
    build:
      context: .
      target: dev
    container_name: fantasy-cricket-web-dev
    ports:
      - "3001:3000"
    # Enables hot reloading by sharing a volume with the local app folder.
    # /app/node_modules is maintained in the container to keep the modules
    # consistent in the container.
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "dev"]

volumes:
  fantasy-cricket-data:
