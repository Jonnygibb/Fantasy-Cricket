services:
  db:
    image: postgres:18.1-alpine
    container_name: fantasy-cricket-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - fantasy-cricket-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:24-alpine
    container_name: fantasy-cricket-dev
    working_dir: /app
    command: >
      sh -c "
        npm install &&
        npx prisma generate &&
        npx prisma migrate dev --name init &&
        npm run dev
      "
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db

volumes:
  fantasy-cricket-data: